      ansible_user: someuser

  children:
    ## Node Alertmanager server
    alertmanager_server:
      hosts:
        alertmanager1:
          ansible_host: 192.XX.XX.27
          ansible_user: someuser

    # Node Exporter servers
    node_exporter_servers:
