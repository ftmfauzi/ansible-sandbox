        node1:
          ansible_host: 192.XX.XX.XX
          ansible_user: someuser
        node2:
          ansible_host: 192.XX.XX.XX
          ansible_user: someuser
        node3:
          ansible_host: 192.XX.XX.XX
          ansible_user: someuser


    # Nginx Exporter servers
    nginx_exporter_servers:
