- name: Set PostgreSQL version and data directory
  set_fact:
    postgresql_version: 16
    pg_data_dir: "/etc/postgresql/16/main"

- name: Add PostgreSQL APT repository
  copy:
    content: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main\n"
    dest: /etc/apt/sources.list.d/pgdg.list
    mode: '0644'

- name: Add PostgreSQL GPG key
  apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install PostgreSQL {{ postgresql_version }}
  apt:
    name: "postgresql-{{ postgresql_version }}"
    state: present

- name: Copy tuning.conf
  copy:
    src: files/tuning.conf
    dest: "{{ pg_data_dir }}/conf.d/tuning.conf"
    owner: postgres
    group: postgres
    mode: '0644'
  notify: Restart PostgreSQL

