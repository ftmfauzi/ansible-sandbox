groups:
- name: Blackbox rules
  rules:
  - alert: blackbox probe failed
    expr: probe_success{job=~"blackbox_production|blackbox_development"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      description: "endpoint failed, domain = {{ $labels.instance }}"

  - alert: SSLCertExpiringSoon
    expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 7
    for: 1m
    labels:
      severity: warning
    annotations:
      description: "TLS certificate will expire in {{ $value | humanizeDuration }} (instance {{ $labels.instance }})"
