- name: Set Prometheus version and arch based on OS
  set_fact:
    # version: "2.53.3"
    version: "3.2.1"
    arch: "linux-amd64"

- name: Create Prometheus user
  user:
    name: prometheus
    system: yes
    shell: /sbin/nologin
    create_home: no
        
- name: Download Prometheus
  get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{version}}/prometheus-{{version}}.{{ arch }}.tar.gz"
    dest: "/tmp/prometheus-{{version}}.{{ arch }}.tar.gz"

- name: Extract Prometheus archive
  unarchive:
    src: "/tmp/prometheus-{{version}}.{{ arch }}.tar.gz"
    dest: "/tmp/"
    remote_src: yes
    # extra_opts: [--strip-components=1]

- name: Create Prometheus configuration directory
  file:
    path: "/etc/prometheus"
    state: directory
    owner: prometheus
    group: prometheus

- name: Create Prometheus data directory
  file:
    path: "/var/lib/prometheus"
    state: directory
    owner: prometheus
    group: prometheus

- name: Move Prometheus binaries
  copy:
    src: "/tmp/prometheus-{{ version }}.{{ arch }}/prometheus"
    dest: "/usr/local/bin/prometheus"
    mode: '0755'
    remote_src: yes

- name: Move Prometheus utilities
  copy:
    src: "/tmp/prometheus-{{ version }}.{{ arch }}/promtool"
    dest: "/usr/local/bin/promtool"
    mode: '0755'
    remote_src: yes

