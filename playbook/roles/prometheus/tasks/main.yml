- name: Copy Prometheus service file
  copy:
    src: files/prometheus.service
    dest: /etc/systemd/system/prometheus.service
    mode: '0644'
  notify: Restart Prometheus

- name: Copy Prometheus config file
  copy:
    src: files/prometheus.yml
    dest: /etc/prometheus/prometheus.yml
    mode: '0644'
  notify: Restart Prometheus


- name: Check Prometheus config
  command: promtool check config /etc/prometheus/prometheus.yml
  register: promtool_check
  failed_when: promtool_check.rc != 0
  changed_when: false

- name: Reload Prometheus using HUP signal
  shell: |
    PID=$(pidof prometheus)
    kill -HUP $PID
  when: promtool_check.rc == 0

- name: Check Prometheus service status
  systemd:
    name: prometheus
    enabled: yes
    state: started
  register: prometheus_status

- name: Show Prometheus status info
  debug:
    var: prometheus_status

- name: systemd reload
  systemd:
    daemon_reload: yes

- name: Start Prometheus service
  systemd:
    name: prometheus
    enabled: yes
    state: started
