- name: Copy Alertmanager config
  template:
    src: templates/alertmanager.yml.j2
    dest: /etc/alertmanager/alertmanager.yml
    mode: '0644'

- name: Copy Alert Template
  copy:
    src: files/alert.tmpl
    dest: /etc/alertmanager/templates/alert.tmpl
    mode: "0644"

- name: Copy Alertmanager service file
  copy:
    src: files/alertmanager.service
    dest: /etc/systemd/system/alertmanager.service
    mode: '0644'

- name: Copy Rules file
  copy:
    src: files/rules.d/node-rules.yml
    dest: /etc/prometheus/rules.d/node-rules.yml
    mode: '0644'

- name: Start Alertmanager service
  systemd:
    name: alertmanager
    enabled: yes
    state: started
